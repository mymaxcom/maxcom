<!DOCTYPE html>
<html lang="ms">
<head>
  <!-- Served by the box at /app/; `flutter build web --base-href /app/` fills this in. -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Aplikasi pentadbiran MAXCOM untuk AJK surau.">
  <meta name="theme-color" content="#06302b">
  <meta name="color-scheme" content="light">

  <!-- Add to Home Screen on the iPad -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Surau">
  <!-- The box serves an opaque icon made from the surau logo here when one is set (apps/box-server surauLogo.ts). -->
  <link rel="apple-touch-icon" href="icons/Icon-maskable-192.png">
  <link rel="icon" type="image/png" href="favicon.png">

  <title>Surau</title>
  <link rel="manifest" href="manifest.json">

  <!-- Kiosk glass while Flutter loads, so the iPad never flashes white. -->
  <style>
    html, body { margin: 0; height: 100%; background: #06302b; }
  </style>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
