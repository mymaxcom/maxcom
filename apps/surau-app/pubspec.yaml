name: surau_app
description: "Aplikasi pentadbiran MAXCOM untuk AJK (Android dan web untuk iPad)."
publish_to: 'none'

version: 2026.11.4+2611040

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  go_router: ^17.0.0
  http: ^1.2.0
  image: ^4.3.0
  image_picker: ^1.1.2
  intl: any
  mobile_scanner: ^7.4.0
  pointycastle: ^4.0.0
  qr_flutter: ^4.1.0
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.0
  web: ^1.1.2
  webview_flutter: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
    # Arabic (see assets/fonts/ARABIC-FONTS.md for sources, hashes and
    # licences). The web build cannot fetch fallback fonts (CSP font-src
    # 'self'), so every Arabic glyph the app shows must come from here.
    - family: QpcHafs
      fonts:
        - asset: assets/fonts/qpc-hafs/KFGQPC-Hafs-V30.ttf
    - family: AmiriQuran
      fonts:
        - asset: assets/fonts/amiri-quran/AmiriQuran.ttf
    - family: NotoNaskhArabic
      fonts:
        - asset: assets/fonts/noto-naskh-arabic/NotoNaskhArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/noto-naskh-arabic/NotoNaskhArabic-Bold.ttf
          weight: 700
